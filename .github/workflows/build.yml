name: Build APK

# Every push to main is built to check it compiles.
# A release (APK on the Releases page) is published only when the workflow is started by hand
# (Actions › Build APK › Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk TrainingTimer-1.0.${{ github.run_number }}.apk

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Training Timer 1.0.${{ github.run_number }}
          body: |
            Download **TrainingTimer-1.0.${{ github.run_number }}.apk** below on your phone and open it to install.
            **training_program.json** is a ready-made import file: in the app go to Exercises → Import / Export → Import exercises.
          files: |
            TrainingTimer-1.0.${{ github.run_number }}.apk
            samples/training_program.json
          make_latest: true

      - name: Save build log
        if: always()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no build log" > /tmp/build.log
          echo "status=${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/status.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-log-tmp
          git rm -rf -q . || true
          git clean -fdq || true
          cp /tmp/build.log build.log
          cp /tmp/status.txt status.txt
          git add build.log status.txt
          git commit -q -m "Build log for run ${{ github.run_number }}"
          git push -f origin HEAD:build-log
